name: CI

on:
  push:
    branches: [main, "task/**", "feat/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            xvfb \
            wget
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend checks
        run: npm run check
      - name: Measure host security surface
        run: bash scripts/measure-host-security.sh
      - name: Rust format
        run: cargo fmt --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      # apps/ide-theia/engine-sidecar is deliberately its own Cargo workspace
      # (see the comment at the top of its Cargo.toml), so `--workspace` above
      # never reaches it. §4/§6/§7/§8/§13 live there — test it explicitly.
      - name: Rust tests (engine sidecar)
        run: cargo test --manifest-path apps/ide-theia/engine-sidecar/Cargo.toml
      - name: Build Tauri Linux bundle
        run: npm run build
      - name: Smoke installed Tauri Linux artifact
        run: bash scripts/smoke-linux-desktop-artifact.sh
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-ide-linux-${{ github.sha }}
          path: target/release/bundle/
          if-no-files-found: error

  theia-extensions:
    name: Theia extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache yarn cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-ide-theia-${{ hashFiles('apps/ide-theia/yarn.lock') }}
          restore-keys: yarn-ide-theia-
      # `--ignore-scripts` on purpose: this job type-checks and unit-tests the
      # instrument-shell-extension, it does not build the Theia bundle, so the
      # native postinstall steps (drivelist, nsfw, theia prepare) are dead weight.
      - name: Install Theia app dependencies
        run: yarn --cwd apps/ide-theia install --frozen-lockfile --ignore-scripts
      - name: Extension tests
        run: yarn --cwd apps/ide-theia test:ext

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend checks
        run: npm run check
      - name: Rust format
        run: cargo fmt --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Build Windows installers
        run: npm run build -- --bundles nsis
      - name: Smoke installed Windows artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis -Filter '*.exe' -Recurse |
            Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          $installRoot = Join-Path $env:LOCALAPPDATA 'AI-Native IDE'
          if (Test-Path $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer exited with $($process.ExitCode)." }
          $app = Get-ChildItem $installRoot -Filter 'ai-native-ide-desktop.exe' -Recurse |
            Select-Object -First 1
          if (-not $app) { throw "Installed app executable is missing from $installRoot." }
          Write-Host "Installed app: $($app.FullName)"
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-ide-windows-${{ github.sha }}
          path: target/release/bundle/nsis/**
          if-no-files-found: error
