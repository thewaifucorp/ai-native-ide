name: CI

on:
  push:
    branches: [main, "task/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            xvfb \
            wget
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend checks
        run: npm run check
      - name: Measure host security surface
        run: bash scripts/measure-host-security.sh
      - name: Rust format
        run: cargo fmt --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Build Tauri Linux bundle
        run: npm run build
      - name: Smoke installed Tauri Linux artifact
        run: bash scripts/smoke-linux-desktop-artifact.sh
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-ide-linux-${{ github.sha }}
          path: target/release/bundle/
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend checks
        run: npm run check
      - name: Rust format
        run: cargo fmt --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Build Windows installers
        run: npm run build -- --bundles nsis
      - name: Smoke installed Windows artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis -Filter '*.exe' -Recurse |
            Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          $installRoot = Join-Path $env:LOCALAPPDATA 'AI-Native IDE'
          if (Test-Path $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer exited with $($process.ExitCode)." }
          $app = Get-ChildItem $installRoot -Filter 'ai-native-ide-desktop.exe' -Recurse |
            Select-Object -First 1
          if (-not $app) { throw "Installed app executable is missing from $installRoot." }
          Write-Host "Installed app: $($app.FullName)"
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-ide-windows-${{ github.sha }}
          path: target/release/bundle/nsis/**
          if-no-files-found: error
