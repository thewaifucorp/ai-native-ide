[package]
name = "benchmark-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
rusqlite = { version = "0.39.0", features = ["bundled"] }
