[package]
name = "ai-native-ide-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "ai_native_ide_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = "2.5.1"

[dependencies]
ide-domain = { path = "../../../crates/ide-domain" }
notify = "8.2.0"
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
tauri = "2.11.5"
tauri-plugin-opener = "2.5.3"
tokio = { version = "1.48.0", features = ["rt", "macros"] }
