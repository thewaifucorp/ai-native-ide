[package]
name = "ai-native-ide-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "ai_native_ide_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = "2.5.1"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.9"
benchmark-service = { path = "../../../crates/benchmark-service" }
ide-domain = { path = "../../../crates/ide-domain" }
ide-agent = { path = "../../../crates/ide-agent" }
ide-reconciliation = { path = "../../../crates/ide-reconciliation" }
ide-guidance = { path = "../../../crates/ide-guidance" }
ide-harness = { path = "../../../crates/ide-harness" }
notify = "8.2.0"
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = "2.11.5"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.3"
tokio = { version = "1.48.0", features = ["rt", "macros", "net", "sync", "io-util"] }

[target.'cfg(windows)'.dependencies]
# `portable-pty` 0.9's ConPTY reader can leave output permanently blocked on
# Windows. Keep its portable backend elsewhere, but use the direct ConPTY
# implementation for the Windows host extension.
conpty = "0.7.0"
